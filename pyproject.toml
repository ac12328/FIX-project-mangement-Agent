[project]
name = "agentfixbpro"
version = "0.1.0"
description = "AI-powered FIX protocol onboarding PM copilot — next generation"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.20",
    "litellm>=1.80",
    "python-telegram-bot[job-queue]>=21.0",
    "fastapi>=0.110",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.27",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "msal>=1.26",
    "requests>=2.31",
    "tiktoken>=0.7",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "numpy>=1.26",
    "pytest-cov>=4.0",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
addopts = "-m \"not live_llm and not legacy_runtime and not soak\""
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_llm: tests that hit the actual local LLM (requires LiteLLM proxy)",
    "legacy_runtime: supported rollback-path coverage; excluded from the product profile",
    "soak: long-running contention, saturation, or resilience coverage",
    "migration: supported database upgrade-matrix coverage",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]
